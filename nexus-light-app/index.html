<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Elite | Panel de Vendedor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nexus-dark': '#020617',
                        'nexus-card': '#0f172a',
                        'nexus-accent': '#6366f1',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-nexus-dark text-white font-['Inter'] selection:bg-nexus-accent/30 overflow-x-hidden min-h-screen flex items-center justify-center p-6">

    <div class="bg-nexus-card border border-slate-800 w-full max-w-lg rounded-2xl p-8 shadow-2xl relative">
        <a href="store.html" class="absolute -top-12 left-0 text-slate-500 hover:text-white flex items-center gap-2 text-xs font-bold uppercase tracking-widest transition-colors">
            &larr; Volver a la Tienda
        </a>

        <div class="flex flex-col mb-8 text-center">
            <h1 class="font-black text-2xl uppercase tracking-widest">Subir Producto</h1>
            <p class="text-xs text-slate-500 mt-2">Sube una imagen técnica. Será validada por AWS Rekognition.</p>
        </div>

        <div id="upload-zone" class="border-2 border-dashed border-slate-700 rounded-xl p-12 text-center hover:border-indigo-500 hover:bg-indigo-500/5 transition-all cursor-pointer">
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <div id="upload-idle">
                <svg class="w-12 h-12 text-slate-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-tighter">Haz clic o arrastra tu imagen aquí</p>
            </div>
        </div>

        <div id="upload-feedback" class="mt-6 hidden p-4 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center gap-4">
            <div id="upload-spinner" class="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></div>
            <span id="upload-status-text" class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">Iniciando...</span>
        </div>
        
        <div class="mt-8 pt-6 border-t border-slate-800 text-center">
             <p class="text-[9px] text-slate-600 font-mono uppercase tracking-[0.2em]">AWS S3 Direct Upload &bull; Event-Driven Architecture</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
